<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Deobfuscator</title>
  <style>
    body {
      background-color: #111113;
      color: #edf2f7;
      font-family: monospace;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    textarea {
      width: 100%;
      height: 300px;
      background: #1b1b1f;
      color: #34eca2;
      border: 1px solid #409eea;
      border-radius: 4px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      padding: 15px 20px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin: 15px 0 5px 0;
      font-size: 16px;
    }
    button:hover { background: #409eea; }
    
    /* Progress Bar Styling */
    progress {
      width: 100%;
      height: 20px;
      margin-bottom: 15px;
      display: none; /* Hidden until clicked */
    }
    progress::-webkit-progress-bar { background-color: #1b1b1f; border-radius: 4px; }
    progress::-webkit-progress-value { background-color: #34eca2; border-radius: 4px; transition: width 0.2s; }
  </style>
</head>
<body>
  <h2>Inner Payload Extractor + JSConfuser AST Pipeline</h2>
  <textarea id="input" placeholder="Paste the full Function(...) payload here..."></textarea>
  
  <button id="btn">Deobfuscate Source</button>
  <progress id="progressBar" value="0" max="100"></progress>
  
  <textarea id="output" placeholder="Deobfuscated code will appear here..." readonly></textarea>

  <script type="module" src="/deobfuscator.js"></script>
</body>
</html>
